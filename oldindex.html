<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maison Naël – La Carte</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8f3e9;--card:#fffdf8;--ink:#23211c;--mute:#7a7364;--gold:#b98a2a;--olive:#7a8458;--line:#e6dcc6;--sand:#efe5d0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{background:var(--bg);color:var(--ink);font-family:Jost,system-ui,sans-serif;font-weight:300;overflow-x:hidden}
.serif,h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600}
/* INTRO */
#intro{position:fixed;inset:0;z-index:50;display:flex;cursor:pointer}
.door{position:relative;width:50%;height:100%;background:var(--bg);display:flex;align-items:center;transition:transform 3s cubic-bezier(.77,0,.18,1)}
.door.l{justify-content:flex-end}.door.r{justify-content:flex-start}
.door img{height:52vh;max-height:430px;width:auto;filter:drop-shadow(0 14px 14px #0002);animation:bow 3.2s ease-in-out infinite;transition:transform 1.5s cubic-bezier(.77,0,.18,1)}
.door.l img{margin-right:-4px;transform:translateX(0)}
.door.r img{margin-left:-4px;}
/* LUSTRE MAISON NAËL */

.lampes {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 30vh;
    display: flex;
    z-index: 3;
    pointer-events: none;
}

.lampe {
    position: relative;
    width: 50%;
    height: 100%;
    overflow: hidden;

    /* Même animation que les portes */
    transition: transform 3s cubic-bezier(.77, 0, .18, 1);
}

.lampe img {
    position: absolute;
    top: 0;

    /* Chaque image occupe la largeur complète */
    width: 200%;
    height: 100%;

    object-fit: contain;
    max-width: none;
}

/* Moitié gauche du lustre */
.lampe.l img {
    left: 0;
}

/* Moitié droite du lustre */
.lampe.r img {
    right: 0;
}

/* Ouverture du lustre */
#intro.open .lampe.l {
    transform: translateX(-101%);
}

#intro.open .lampe.r {
    transform: translateX(101%);
}
@keyframes bow{50%{translate:0 -6px}}
#intro.open .door.l{transform:translateX(-101%)}#intro.open .door.r{transform:translateX(101%)}
.ground{position:absolute;left:12%;right:12%;top:calc(50% + 26vh);height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);z-index:2;pointer-events:none;transition:opacity .6s}
#intro .t{position:absolute;left:0;right:0;text-align:center;z-index:2;pointer-events:none;transition:opacity .6s}
.t.top{top:calc(env(safe-area-inset-top,0px) + 7vh)}.t.top small{letter-spacing:.4em;text-transform:uppercase;font-size:.66rem;color:var(--olive)}
.t.top h1{font-size:2.8rem;letter-spacing:.04em;margin-top:4px}
.t.bot{bottom:calc(env(safe-area-inset-bottom,0px) + 6vh);font-size:.75rem;letter-spacing:.3em;text-transform:uppercase;color:var(--mute);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.3}}
#intro.open .t,#intro.open .ground {opacity:0}#intro.gone{display:none}
/* HEADER */
header{padding:70px 24px 10px;position:relative}
header .pill{display:inline-block;font-size:.62rem;letter-spacing:.3em;text-transform:uppercase;border:1px solid var(--ink);border-radius:99px;padding:6px 14px}
header h1{font-size:3.6rem;line-height:.95;margin:22px 0 10px;letter-spacing:-.01em}
header h1 i{color:var(--gold);font-weight:500}
header p{color:var(--mute);max-width:260px;line-height:1.5;font-size:.95rem}
nav{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translate(-50%,-90px);z-index:30;max-width:calc(100% - 24px);background:#23211cee;backdrop-filter:blur(12px);border-radius:99px;padding:5px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;transition:transform .6s cubic-bezier(.2,1.2,.4,1);box-shadow:0 12px 30px #0003}
nav.show{transform:translate(-50%,0)}nav::-webkit-scrollbar{display:none}
nav a{flex:none;text-decoration:none;color:#f8f3e9aa;font-size:.74rem;padding:9px 15px;border-radius:99px;transition:.35s;white-space:nowrap}
nav a.on{background:var(--gold);color:#fff}
section{padding-top:64px}
.sh{padding:0 24px;display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.sh h2{font-size:2.5rem;line-height:1}
.sh h2 small{display:block;font-family:Jost;font-weight:300;font-size:.7rem;letter-spacing:.3em;text-transform:uppercase;color:var(--olive);margin-bottom:8px}
.num{font-family:'Cormorant Garamond',serif;font-size:4.6rem;line-height:.8;color:transparent;-webkit-text-stroke:1px var(--gold);opacity:.7}
.row{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 24px 26px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.card{flex:none;width:74vw;max-width:330px;aspect-ratio:4/5.4;scroll-snap-align:center;position:relative;border-radius:34px;overflow:hidden;background:var(--c);box-shadow:0 22px 40px -18px #3a2d0f55;opacity:0;transform:translateX(40px) scale(.94);transition:opacity .8s,transform .9s cubic-bezier(.2,.9,.3,1)}
.card.in{opacity:1;transform:none}
.img{position:absolute;inset:0;background:radial-gradient(120% 80% at 20% 10%,#fff9,transparent 55%),radial-gradient(90% 70% at 90% 100%,var(--d),transparent 70%),var(--c);background-size:cover;background-position:center;transition:transform 1.2s}
.card:active .img{transform:scale(1.06)}
.ini{position:absolute;right:-6%;top:6%;font-family:'Cormorant Garamond',serif;font-size:14rem;line-height:.8;color:#fff;opacity:.35;font-weight:600;pointer-events:none}
.has .ini{display:none}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,#1c1a16d9);pointer-events:none}
.top{position:absolute;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;z-index:2}
.tag{font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;background:#fffdf8d9;backdrop-filter:blur(8px);padding:7px 12px;border-radius:99px}
.pr{margin-left:auto;font-family:'Cormorant Garamond',serif;font-size:1.25rem;font-weight:600;background:var(--gold);color:#fff;padding:5px 14px;border-radius:99px}
.info{position:absolute;left:20px;right:20px;bottom:20px;color:#fff;z-index:2}
.info h3{font-size:1.9rem;line-height:1;margin-bottom:8px}
.info p{font-size:.82rem;line-height:1.45;opacity:.85}
.pair{margin-top:12px;font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:#ecd08a}
.cnt{padding:0 24px;font-size:.7rem;letter-spacing:.25em;color:var(--mute);margin-top:-8px}
footer{text-align:center;padding:50px 20px 60px;color:var(--mute);font-size:.8rem}
footer .serif{font-size:1.6rem;font-style:italic;color:var(--ink);line-height:1.2}
</style></head><body>
<div id="intro">

    <!-- Lustre divisé en deux parties -->
    <div class="lampes">
        <div class="lampe l">
            <img src="./images/lampes.png" alt="">
        </div>

        <div class="lampe r">
            <img src="./images/lampes.png" alt="">
        </div>
    </div>

    <!-- Monsieur Naël à gauche -->
<div class="door l">
    <img src="./images/monsieurNael.png"
         alt="Monsieur Naël"
         loading="lazy">
</div>

<!-- Madame Naël à droite -->
<div class="door r">
    <img src="./images/madameNael.png"
         alt="Madame Naël"
         loading="lazy">
</div>
    <div class="ground"></div>

    <div class="t bot">Touchez pour entrer</div>

</div>
<header><span class="pill">Sousse</span><h1 class="serif">Maison<br><i>Naël</i></h1><p>Café, viennoiseries &amp; douceurs. Prenez place, le moment est à vous.</p></header>
<nav id="nav"></nav>
<main id="menu"></main>
<footer><div class="serif">Monsieur &amp; Madame Naël<br>vous souhaitent un délicieux moment</div><p style="margin-top:10px">Prix en dinars tunisiens (DT)</p></footer>
<script>
var PHOTOS={"Espresso":"./espresso.png","Iced latte":"./icedLatte.png" , "Croissant beurre" : "./croissant.png"};/* nom du produit -> photo (data URI) */
var D=[
{id:"chauds",t:"Cafés chauds",s:"Torréfiés avec soin",c:"#e2cfa6",d:"#b98a2a66",i:[
["Espresso","Court, intense et soyeux, une crème dorée.","Avec un croissant beurre",3.5],["Café crème","Onctueux, doux, mousse de lait fine.","Avec un pain aux raisins",5,"Favori"],["Cappuccino","Mousse veloutée, voile de cacao.","Avec un chausson aux pommes",6.5],["Latte vanille","Lait fondant, vanille de Madagascar.","Avec un éclair café",7.5]]},
{id:"froids",t:"Cafés froids",s:"Fraîcheur et caractère",c:"#cfd6b0",d:"#7a845899",i:[
["Iced latte","Espresso, lait froid et glaçons cristallins.","Avec un pain au chocolat",8],["Cold brew","Infusé à froid pendant 18 heures.","Avec un mille-feuille",8.5,"Nouveau"],["Frappé caramel","Crémeux, nappage caramel beurre salé.","Avec une crêpe sucrée",9.5],["Affogato","Glace vanille noyée d’espresso chaud.","Seul, en toute élégance",9]]},
{id:"cocktails",t:"Cocktails",s:"Sans alcool, tout en élégance",c:"#ebcf80",d:"#b98a2a99",i:[
["Mojito citron vert","Menthe fraîche, citron vert, pétillant.","Avec une tarte citron",10],["Spritz agrumes","Orange sanguine, romarin, bulles fines.","Avec un croissant",11,"Signature"],["Fruits rouges","Fraise, framboise et basilic frais.","Avec un éclair",10.5],["Passion mangue","Fruit de la passion, mangue mûre.","Avec une crêpe",11]]},
{id:"viennoiseries",t:"Viennoiseries",s:"Pétries et dorées chaque matin",c:"#ecd9b6",d:"#c9992b77",i:[
["Croissant beurre","Feuilleté, doré, au beurre pur.","Avec un café crème",3.5,"Favori"],["Pain au chocolat","Deux barres de chocolat noir.","Avec un cappuccino",4],["Chausson aux pommes","Compote maison, croûte croustillante.","Avec un espresso",4.5],["Pain aux raisins","Crème pâtissière et raisins gorgés.","Avec un latte vanille",4.5]]},
{id:"douceurs",t:"Douceurs",s:"Pour finir en beauté",c:"#d6dcb9",d:"#7a845888",i:[
["Éclair café","Crème légère, glaçage brillant.","Avec un espresso",6],["Tarte citron","Meringue dorée au chalumeau.","Avec un mojito",7.5],["Mille-feuille","Vanille de Madagascar, feuilletage fin.","Avec un cold brew",8],["Crêpe sucrée","Chocolat ou caramel beurre salé.","Avec un frappé",9]]}];
var n='',h='';
D.forEach(function(c,ci){n+='<a href="#'+c.id+'">'+c.t+'</a>';
h+='<section id="'+c.id+'"><div class="sh"><h2><small>'+c.s+'</small>'+c.t+'</h2><div class="num">0'+(ci+1)+'</div></div><div class="row" style="--c:'+c.c+';--d:'+c.d+'">';
c.i.forEach(function(p){var ph=PHOTOS[p[0]];h+='<div class="card'+(ph?' has':'')+'"><div class="img"'+(ph?' style="background-image:url('+ph+')"':'')+'></div><div class="ini">'+p[0][0]+'</div><div class="top">'+(p[4]?'<span class="tag">'+p[4]+'</span>':'')+'<span class="pr">'+p[3].toFixed(1)+'</span></div><div class="info"><h3 class="serif">'+p[0]+'</h3><p>'+p[1]+'</p><div class="pair">'+p[2]+'</div></div></div>'});
h+='</div><div class="cnt">GLISSEZ →</div></section>'});
var nav=document.getElementById('nav');nav.innerHTML=n;document.getElementById('menu').innerHTML=h;
var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.2});
document.querySelectorAll('.card').forEach(function(x){io.observe(x)});
var links=nav.querySelectorAll('a'),so=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){links.forEach(function(a){a.classList.toggle('on',a.getAttribute('href')=='#'+e.target.id)});var a=nav.querySelector('.on');if(a)nav.scrollTo({left:a.offsetLeft-40,behavior:'smooth'})}})},{rootMargin:'-30% 0px -60% 0px'});
document.querySelectorAll('section').forEach(function(s){so.observe(s)});
addEventListener('scroll',function(){nav.classList.toggle('show',scrollY>380)},{passive:true});
var it=document.getElementById('intro'),done=false;
function openIt(){if(done)return;done=true;it.classList.add('open');setTimeout(function(){it.classList.add('gone')},1600)}
it.onclick=openIt;setTimeout(openIt,4000);
</script></body></html>
